name: Release

# Push a tag like v0.1.0 to build installers for macOS (Apple Silicon + Intel) and Windows.
# The result is a DRAFT release: install and test it on real machines (docs/RELEASE_CHECKLIST.md)
# before publishing. Builds are unsigned unless signing secrets are configured (see README).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Markdown Companion ${{ github.ref_name }}
          releaseBody: See docs/RELEASE_CHECKLIST.md. Unsigned build; see README for first-launch steps.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
